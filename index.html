  :root { --bg: #0e0a09; --fg: #efe4d2; --mute: #8a7a6c; --acc: #d2301e; --sky: #5fb8e6; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Martian Mono", monospace; overflow: hidden; }
  #wrap { position: absolute; inset: 0 0 92px 0; display: flex; align-items: center; justify-content: center; }
  #stage { width: 1920px; height: 1080px; transform-origin: 0 0; position: absolute; left: 0; top: 0; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  #out { width: 1920px; height: 1080px; display: block; }
  body.render #wrap { inset: 0; display: block; }
  body.render #stage { transform: none !important; box-shadow: none; }
  body.render #ui { display: none; }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; padding: 10px 18px; box-sizing: border-box; background: #15100e; border-top: 1px solid #2a201c; font-size: 12px; }
  #row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  button { background: #241b17; color: var(--fg); border: 1px solid #3a2c25; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  #tc { font-size: 16px; letter-spacing: .08em; min-width: 140px; }
  #sec { color: var(--mute); }
  #bar { position: relative; height: 26px; background: #1d1613; border-radius: 4px; cursor: pointer; overflow: hidden; }
  #bar .s { position: absolute; top: 0; bottom: 0; border-right: 1px solid #0e0a09; font-size: 10px; padding: 6px 6px; box-sizing: border-box; color: #cdb9a5; white-space: nowrap; overflow: hidden; }
  #head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--acc); pointer-events: none; }
  #hint { margin-left: auto; color: var(--mute); }
  #err { color: var(--acc); }
